<style>
  :root{
    --cream:#F7F4EE;
    --cream-2:#EFE9DF;
    --ink:#2A2320;
    --muted:#7C7268;
    --wine:#7B2E3C;        /* deep romantic wine */
    --wine-deep:#5E212C;
    --rose:#C98B92;        /* soft rose */
    --rose-soft:#E9CDCF;
    --gold:#B8975A;        /* AHAVA gold accent */
    --gold-soft:#E4D5B7;
    --line:#E2D9CC;
    --card:#FFFFFF;
    --shadow:0 18px 50px -18px rgba(94,33,44,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 80% at 80% -10%, rgba(201,139,146,.16), transparent 60%),
      radial-gradient(120% 80% at -10% 110%, rgba(184,151,90,.14), transparent 55%),
      var(--cream);
    color:var(--ink);
    font-family:"Assistant",sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
  }
  h1,h2,h3,.serif{font-family:"Frank Ruhl Libre",serif;font-weight:700;letter-spacing:-.01em}
  .wrap{width:100%;max-width:560px;margin:0 auto}
  .stage{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:26px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }
  .pad{padding:30px 26px 30px}
  .eyebrow{
    font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin:0 0 14px
  }
  .eyebrow .heart{color:var(--rose)}
  .mockup-flag{
    position:fixed;top:10px;left:10px;z-index:50;
    background:var(--wine);color:#fff;font-size:11px;font-weight:600;
    padding:5px 11px;border-radius:999px;letter-spacing:.04em;opacity:.85
  }

  /* ---------- LANDING ---------- */
  .hero-band{
    background:
      radial-gradient(110% 120% at 70% 0%, rgba(233,205,207,.55), transparent 60%),
      linear-gradient(160deg,#fbf6f1,#f3e7e6);
    padding:38px 26px 30px;text-align:center;border-bottom:1px solid var(--line)
  }
  .logo{font-family:"Frank Ruhl Libre",serif;font-weight:900;letter-spacing:.42em;
    font-size:18px;color:var(--ink);margin:0 0 4px;padding-right:.42em}
  .logo small{display:block;font-family:"Assistant";font-weight:400;letter-spacing:.3em;
    font-size:9px;color:var(--muted);margin-top:6px}
  .ornament{font-size:22px;color:var(--rose);margin:18px 0 4px;letter-spacing:.3em}
  h1{font-size:33px;line-height:1.12;margin:6px 0 12px}
  h1 .accent{color:var(--wine);font-style:italic}
  .lead{color:var(--muted);font-size:16px;line-height:1.6;margin:0 auto;max-width:420px}
  .icons-row{
    display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:26px 0 4px
  }
  .icon-card{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:14px 6px 11px;text-align:center
  }
  .icon-emoji{font-size:24px;display:block;margin-bottom:7px}
  .icon-name{font-family:"Frank Ruhl Libre",serif;font-size:13px;font-weight:700;line-height:1.2}
  .icon-sub{font-size:10.5px;color:var(--muted);margin-top:3px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    width:100%;border:none;cursor:pointer;
    background:var(--wine);color:#fff;
    font-family:"Assistant";font-weight:600;font-size:17px;
    padding:16px 22px;border-radius:999px;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
    box-shadow:0 12px 26px -12px rgba(94,33,44,.6)
  }
  .btn:hover{background:var(--wine-deep);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:500;font-size:14px}
  .btn.ghost:hover{color:var(--ink);background:transparent}
  .btn.gold{background:var(--gold)}
  .btn.gold:hover{background:#a3854b}
  .fineprint{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.5}

  /* ---------- PROGRESS ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:18px 22px 0}
  .back{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;
    line-height:1;padding:4px 6px;border-radius:8px}
  .back:hover{color:var(--wine);background:var(--cream)}
  .hearts{display:flex;gap:7px;flex:1;justify-content:center}
  .hearts span{font-size:15px;color:var(--rose-soft);transition:color .25s, transform .25s}
  .hearts span.on{color:var(--wine);transform:scale(1.18)}
  .qcount{font-size:12px;color:var(--muted);min-width:34px;text-align:left}

  /* ---------- QUESTION ---------- */
  .q-head{text-align:center;padding:8px 6px 6px}
  .q-kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);

  .q-title{font-size:25px;line-height:1.2;margin:0 0 4px}
  .q-sub{color:var(--muted);font-size:14px;margin:8px 0 0}
  .options{display:grid;gap:11px;margin-top:20px}
  .opt{
    display:flex;align-items:center;gap:14px;text-align:right;
    background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:15px 16px;cursor:pointer;width:100%;
    font-family:"Assistant";transition:border-color .18s, background .18s, transform .12s
  }
  .opt:hover{border-color:var(--rose);background:#fdf8f7;transform:translateX(-2px)}
  .opt .o-emoji{
    width:46px;height:46px;flex:0 0 46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(150deg,var(--rose-soft),var(--gold-soft))
  }
  .opt .o-text{flex:1}
  .opt .o-title{font-weight:600;font-size:16px;line-height:1.25}
  .opt .o-desc{font-size:13px;color:var(--muted);margin-top:2px}
  .opt .o-arrow{color:var(--rose);font-size:18px;opacity:0;transition:opacity .18s}
  .opt:hover .o-arrow{opacity:1}

  /* ---------- EMAIL ---------- */
  .center{text-align:center}
  .email-ic{font-size:30px;color:var(--rose);margin-bottom:6px}
  .field{
    width:100%;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;font-family:"Assistant";font-size:16px;margin-top:11px;
    text-align:right;background:#fff;color:var(--ink)
  }
  .field:focus{outline:none;border-color:var(--rose)}

  /* ---------- RESULT ---------- */
  .result-band{
    background:
      radial-gradient(120% 130% at 70% 0%, rgba(233,205,207,.6), transparent 62%),
      linear-gradient(165deg,#fbf6f1,#f1e3e2);
    text-align:center;padding:34px 24px 26px;border-bottom:1px solid var(--line);position:relative
  }
  .match-badge{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:118px;height:118px;border-radius:50%;
    background:#fff;border:2px solid var(--gold);box-shadow:0 10px 24px -12px rgba(184,151,90,.6);
    margin:0 auto 14px
  }
  .match-pct{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:34px;color:var(--wine);line-height:1}
  .match-lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px}
  .love-style{font-size:13px;letter-spacing:.06em;color:var(--rose);font-weight:600;margin:0 0 4px}
  .result-name{font-size:29px;line-height:1.12;margin:2px 0 10px}
  .result-tag{color:var(--muted);font-size:15px;line-height:1.55;margin:0 auto;max-width:400px}
  .reading{
    background:var(--cream);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px;font-size:15px;line-height:1.7;color:#4a4038;margin:22px 0 4px;
    position:relative
  }

    top:2px;right:14px;font-size:46px;color:var(--rose-soft);line-height:1}

  .ritual-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px}
  .product{
    display:flex;gap:14px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px
  }
  .product .pimg{
    width:66px;height:78px;flex:0 0 66px;border-radius:11px;
    background:linear-gradient(160deg,#eef1f3,#dfe6ea);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#9aa6ad;
    text-align:center;line-height:1.25;padding:6px;border:1px solid #e7ecef
  }
  .product .pinfo{flex:1;min-width:0}
  .product .pname{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:16px;line-height:1.2}
  .product .pwhy{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .product .pprice{margin-top:7px;display:flex;align-items:baseline;gap:8px}
  .pprice .now{font-weight:700;font-size:16px;color:var(--wine)}
  .pprice .was{font-size:13px;color:#b7aea3;text-decoration:line-through}
  .pprice .save{font-size:11px;background:var(--rose-soft);color:var(--wine-deep);
    padding:2px 7px;border-radius:999px;font-weight:600}
  .hero-product{border:1.5px solid var(--gold);background:#fffdf7;position:relative}
  .hero-product .pimg{background:linear-gradient(160deg,var(--gold-soft),#efe2c2);color:#9c8a5e}
  .soul-tag{position:absolute;top:-10px;right:14px;background:var(--gold);color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:999px}

  .coupon{
    margin:22px 0 4px;border:1.5px dashed var(--wine);border-radius:16px;
    background:linear-gradient(160deg,#fff,#fbf1f1);padding:18px;text-align:center
  }
  .coupon .c-top{font-size:13px;color:var(--muted)}
  .coupon .c-code{
    font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:30px;letter-spacing:.14em;
    color:var(--wine);margin:6px 0 2px
  }
  .coupon .c-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .total{display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px 2px;font-size:15px}
  .total .t-now{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:22px;color:var(--wine)}
  .share{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
  .share a{color:var(--wine);text-decoration:none;font-weight:600;border-bottom:1px solid var(--rose-soft)}

  .hidden{display:none!important}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (max-width:430px){
    .pad{padding:24px 18px 26px}
    h1{font-size:28px}
    .result-name{font-size:25px}
    .q-title{font-size:22px}
    .icons-row{gap:7px}
    .icon-name{font-size:12px}
    .icon-sub{display:none}
    .opt{padding:13px 13px;gap:11px}
    .opt .o-emoji{width:42px;height:42px;flex-basis:42px;font-size:20px}
  }
</style>
</head>

    options:[
      {key:"glow",     emoji:"✨", title:"זוהר וקורן",        desc:"כאילו הדלקת אור מבפנים"},
      {key:"timeless", emoji:"💪", title:"מוצק ומרוכך",        desc:"חלק, מתוח, צעיר"},
      {key:"calm",     emoji:"💧", title:"לח, רגוע ועוטף",     desc:"רך ומאוזן"},
      {key:"bold",     emoji:"🌿", title:"מחודש ונקי לעומק",   desc:"כמו התחלה חדשה"}
    ]
  }
];

/* ---------------- state ---------------- */
let state = { step:"landing", qIndex:0, votes:[] };
const stage = document.getElementById("stage");
const money = n => "₪" + n.toLocaleString("he-IL");

function render(){
  stage.classList.remove("fade"); void stage.offsetWidth; stage.classList.add("fade");
  if(state.step==="landing") return renderLanding();
  if(state.step==="question") return renderQuestion();
  if(state.step==="email")    return renderEmail();
  if(state.step==="result")   return renderResult();
}

/* ---------------- LANDING ---------------- */
function renderLanding(){
  stage.innerHTML = `
    <div class="hero-band">
      <p class="logo">AHAVA<small>DEAD SEA LABORATORIES</small></p>
      <div class="ornament">♡ ⸻ ♡ ⸻ ♡</div>
      <p class="eyebrow">לכבוד טו באב <span class="heart">♥</span> חג האהבה</p>
      <h1>מצאי את <span class="accent">הזיווג המושלם</span> שלך</h1>
      <p class="lead">כל סיפור אהבה מתחיל בהתאמה נכונה. עני על 4 שאלות קטנות, ונשדך אותך למוצר ה‑AHAVA שנברא בשבילך — עם כרטיס התאמה אישי.</p>
    </div>
    <div class="pad">
      <div class="icons-row">
        ${INTRO_ICONS.map(i=>`
          <div class="icon-card">
            <span class="icon-emoji">${i.emoji}</span>
            <div class="icon-name">${i.name}</div>
            <div class="icon-sub">${i.sub}</div>
          </div>`).join("")}
      </div>
      <p class="fineprint" style="margin:18px 0 16px">4 שאלות · פחות מדקה · ובסוף מחכה לך הפתעה של <b>30% הנחה</b></p>
      <button class="btn" onclick="startQuiz()">בואו נמצא התאמה ♥</button>
      <p class="fineprint">לרגל טו באב · קוד הנחה <b>${COUPON}</b> · בתוקף לזמן מוגבל</p>
    </div>`;
}

/* ---------------- QUESTION ---------------- */
function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  const hearts = Array.from({length:total},(_,i)=>
    `<span class="${i<=state.qIndex?"on":""}">♥</span>`).join("");
  stage.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="goBack()" aria-label="חזרה">›</button>
      <div class="hearts">${hearts}</div>
      <div class="qcount">${state.qIndex+1}/${total}</div>
    </div>
    <div class="pad" style="padding-top:14px">
      <div class="q-head">
        <p class="q-kicker">${q.kicker}</p>
        <h2 class="q-title">${q.title}</h2>
        ${q.sub?`<p class="q-sub">${q.sub}</p>`:""}
      </div>
      <div class="options">
        ${q.options.map((o,i)=>`
          <button class="opt" onclick="pick('${o.key}')">
            <span class="o-emoji">${o.emoji}</span>
            <span class="o-text">
              <span class="o-title">${o.title}</span>
              ${o.desc?`<span class="o-desc">${o.desc}</span>`:""}
            </span>
            <span class="o-arrow">‹</span>
          </button>`).join("")}
      </div>
    </div>`;
}

/* ---------------- EMAIL ---------------- */
function renderEmail(){
  stage.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="goBack()" aria-label="חזרה">›</button>
      <div class="hearts">${"<span class='on'>♥</span>".repeat(4)}</div>
      <div class="qcount"></div>
    </div>
    <div class="pad center" style="padding-top:18px">
      <div class="email-ic">💌</div>
      <h2 class="q-title">מצאנו את הזיווג שלך!</h2>
      <p class="q-sub" style="margin-top:10px">לאן לשלוח את ההתאמה שלך ואת קוד ה‑30%?<br>נשמור לך אותם גם להמשך — בלי לחץ.</p>
      <input class="field" id="fname" placeholder="השם שלך" />
      <input class="field" id="email" type="email" placeholder="כתובת אימייל" />
      <div style="margin-top:18px">
        <button class="btn" onclick="goResult()">גלי את ההתאמה ♥</button>
        <button class="btn ghost" onclick="goResult()" style="margin-top:8px">דלגי — קחי אותי ישר לתוצאה</button>
      </div>
      <p class="fineprint">בלי ספאם. רק העור שלך והקוד שלך.</p>
    </div>`;
}

/* ---------------- RESULT ---------------- */
function renderResult(){
  const key = scoreMatch();
  const m = MATCHES[key];
  const ritualItems = [{...m, isHero:true, bottle:m.bottle, name:m.name, price:m.price, why:m.why}, ...m.support];
  const subtotal = ritualItems.reduce((s,p)=>s+p.price,0);
  const discounted = Math.round(subtotal*(1-DISCOUNT));

  const priceRow = p => {
    const now = Math.round(p.price*(1-DISCOUNT));
    return `<div class="pprice">
        <span class="now">${money(now)}</span>
        <span class="was">${money(p.price)}</span>
        <span class="save">‑30%</span>
      </div>`;
  };

  stage.innerHTML = `
    <div class="result-band">
      <div class="match-badge">
        <span class="match-pct">${m.pct}%</span>
        <span class="match-lbl">התאמה</span>
      </div>
      <p class="love-style">${m.emoji} ${m.loveStyle}</p>
      <h2 class="result-name">${m.name}</h2>
      <p class="result-tag">${m.tagline}</p>
    </div>
    <div class="pad">
      <div class="reading">${m.reading}</div>

      <h3 class="ritual-h">הריטואל המושלם שלכן ♥</h3>
      <p class="ritual-sub">המוצר שנברא בשבילך + שניים שמשלימים אותו</p>

      <div class="product hero-product">
        <span class="soul-tag">הזיווג שלך</span>
        <div class="pimg">${m.bottle}</div>
        <div class="pinfo">
          <div class="pname">${m.name}</div>
          <div class="pwhy">${m.why}</div>
          ${priceRow(m)}
        </div>
      </div>
      ${m.support.map(p=>`
        <div class="product">
          <div class="pimg">${p.bottle}</div>
          <div class="pinfo">
            <div class="pname">${p.name}</div>
            <div class="pwhy">${p.why}</div>
            ${priceRow(p)}
          </div>
        </div>`).join("")}

      <div class="coupon">
        <div class="c-top">מתנת טו באב שלך 🤍</div>
        <div class="c-code">${COUPON}</div>
        <div class="c-sub">30% הנחה על הריטואל המושלם · בתוקף לזמן מוגבל</div>
        <button class="btn gold" onclick="copyCode()" id="copyBtn">העתיקי את הקוד</button>
      </div>

      <div class="total">
        <span>סה״כ לריטואל המלא</span>
        <span><span class="was" style="font-size:14px">${money(subtotal)}</span> &nbsp; <span class="t-now">${money(discounted)}</span></span>
      </div>

      <div style="margin-top:14px">
        <button class="btn" onclick="alert('בבנייה האמיתית: לעגלת AHAVA הישראלית עם הקוד מוחל אוטומטית')">הוסיפי את הריטואל לעגלה ♥</button>
        <button class="btn ghost" onclick="restart()" style="margin-top:8px">עשי את הקוויז שוב</button>
      </div>

      <p class="share">אהבת? <a href="#" onclick="return false">שתפי חברה ותגלו מי הזיווג שלה ♥</a></p>
    </div>`;
}

/* ---------------- logic ---------------- */
function startQuiz(){ state={step:"question",qIndex:0,votes:[]}; render(); }
function pick(key){
  state.votes[state.qIndex]=key;
  if(state.qIndex < QUESTIONS.length-1){ state.qIndex++; state.step="question"; }
  else { state.step="email"; }
  render();
}
function goBack(){
  if(state.step==="email"){ state.step="question"; state.qIndex=QUESTIONS.length-1; }
  else if(state.step==="question" && state.qIndex>0){ state.qIndex--; }
  else { state.step="landing"; }
  render();
}
function goResult(){ state.step="result"; render(); }
function restart(){ state={step:"landing",qIndex:0,votes:[]}; render(); }

function scoreMatch(){
  const tally={};
  state.votes.forEach(k=>tally[k]=(tally[k]||0)+1);
  let best=null, bestN=-1;
  // tie-break: prefer the answer to Q1
  const order=[state.votes[0], ...Object.keys(MATCHES)];
  order.forEach(k=>{ if(k && (tally[k]||0)>bestN){ bestN=tally[k]||0; best=k; }});
  return best || "glow";
}
function copyCode(){
  navigator.clipboard?.writeText(COUPON);
  const b=document.getElementById("copyBtn");
  if(b){ b.textContent="✓ הקוד הועתק!"; setTimeout(()=>b.textContent="העתיקי את הקוד",1800); }
}

render();
</script>
</body>
</html>
