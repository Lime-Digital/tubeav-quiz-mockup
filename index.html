<style>
  :root{
    /* AHAVA Tu B'Av — warm editorial palette (from the creative examples) */
    --cream:#FAF6EF;
    --sand:#EFE7D9;       /* warm beige band */
    --taupe:#E3D6C3;      /* deeper warm taupe (MEDIA 30% bg) */
    --inset:#F6F0E6;
    --card:#FFFFFF;
    --ink:#2B2118;        /* espresso-brown ink (warm, not black) */
    --ink2:#4A3D30;
    --muted:#857A6C;
    --faint:#AEA493;
    --line:#E5DDCE;
    --gold:#C4A265;
    --gold-soft:#E7CF9B;
    --gold-line:rgba(196,162,101,.4);
    --rose:#CC9A82;       /* soft Tu B'Av warmth */
    --shadow:0 16px 40px rgba(43,33,24,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Assistant",sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;
  }
  h1,h2,h3{font-family:"Assistant",sans-serif;font-weight:800;letter-spacing:-.02em}
  .wrap{width:100%;max-width:540px;margin:0 auto}
  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);overflow:hidden;position:relative;
  }
  .pad{padding:30px 26px 32px}
  .mockup-flag{
    position:fixed;top:10px;left:10px;z-index:50;background:var(--ink);color:#fff;
    font-size:11px;font-weight:500;padding:5px 11px;border-radius:999px;letter-spacing:.04em;opacity:.82
  }

  /* logo + ornament */
  .logo{font-family:"Assistant";font-weight:600;letter-spacing:.45em;font-size:17px;
    color:var(--ink);margin:0;padding-right:.45em;text-align:center}
  .logo small{display:block;font-weight:400;letter-spacing:.3em;font-size:8.5px;
    color:var(--faint);margin-top:7px;padding-right:.3em}
  .orn{display:flex;align-items:center;justify-content:center;gap:13px;margin:18px 0}
  .orn .rule{height:1px;width:54px;background:var(--gold-line)}
  .orn .star{color:var(--gold);font-size:14px}
  .kicker{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin:0;text-align:center}
  .kicker.he{letter-spacing:.12em}

  /* ---------- LANDING : photo-led hero (warm editorial, like the creatives) ---------- */
  .hero-photo{
    position:relative;height:clamp(280px,44vh,380px);width:100%;
    background-image:url("img/hero-landing.jpg");
    background-size:contain;background-repeat:no-repeat;background-position:center;
    background-color:var(--sand);
  }
  .hero-photo .hp-logo{position:absolute;top:16px;left:0;right:0;text-align:center;
    font-weight:600;letter-spacing:.5em;font-size:14px;color:var(--ink);padding-right:.5em;opacity:.85}
  .hp-kicker{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin:0 0 6px;text-align:center}
  .hero-h1{font-size:29px;font-weight:800;line-height:1.16;letter-spacing:-.02em;color:var(--ink);margin:0 0 4px;text-align:center}
  .hero-h1 .accent{color:var(--gold)}

  h1{font-size:31px;line-height:1.16;margin:14px 0 12px}
  h1 .accent{color:var(--gold)}
  .lead{color:var(--muted);font-size:14.5px;line-height:1.7;margin:0 auto;max-width:430px;font-weight:400}
  .promise{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
    font-size:12.5px;color:var(--ink2);margin:18px 0 2px;font-weight:400}
  .promise b{color:var(--gold);font-weight:600}
  .promise .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}

  /* buttons — AHAVA style */
  .btn{

    background:var(--ink);color:#fff;font-family:"Assistant";font-weight:500;font-size:14px;
    letter-spacing:.1em;padding:16px 22px;border-radius:999px;

  .btn:hover{background:var(--gold)}
  .btn:active{transform:scale(.99)}
  .btn .chev{font-size:16px;opacity:.8}
  .btn.gold{background:var(--gold);color:var(--ink);font-weight:600}
  .btn.gold:hover{background:var(--ink);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:400;letter-spacing:.04em;font-size:13.5px}
  .btn.ghost:hover{background:transparent;color:var(--ink)}
  .btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.outline:hover{border-color:var(--gold);background:var(--inset);color:var(--ink)}
  .fineprint{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.55;font-weight:300}
  .fineprint b{font-weight:600;color:var(--ink2)}
  .footstrip{text-align:center;font-size:11.5px;color:var(--faint);margin:16px 0 0;letter-spacing:.02em}
  .footstrip b{color:var(--gold);font-weight:600;letter-spacing:.08em}

  .back{background:none;border:none;color:var(--faint);font-size:24px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
  .back:hover{color:var(--gold)}
  .dots{display:flex;gap:9px;flex:1;justify-content:center}
  .dots span{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .25s,transform .25s}
  .dots span.on{background:var(--gold);transform:scale(1.25)}
  .qcount{font-size:11px;color:var(--faint);min-width:34px;text-align:left;letter-spacing:.1em}

  /* ---------- QUESTION ---------- */
  .q-head{text-align:center;padding:10px 6px 4px}
  .q-title{font-size:24px;line-height:1.26;margin:12px 0 4px}
  .q-sub{color:var(--muted);font-size:14px;margin:10px 0 0;font-weight:300}
  .options{display:grid;gap:10px;margin-top:22px}
  .opt{display:flex;align-items:center;gap:14px;text-align:right;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;width:100%;
    font-family:"Assistant";transition:border-color .18s,background .18s}
  .opt:hover{border-color:var(--gold);background:var(--inset)}
  .opt .o-thumb{width:50px;height:50px;flex:0 0 50px;border-radius:10px;object-fit:cover;

  .opt .o-title{display:block;font-weight:700;font-size:15.5px;line-height:1.3}
  .opt .o-desc{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45;font-weight:400}
  .opt .o-arrow{color:var(--gold);font-size:18px;opacity:0;transition:opacity .18s}
  .opt:hover .o-arrow{opacity:1}

  .center{text-align:center}
  .field{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;

  .field:focus{outline:none;border-color:var(--gold)}
  .lead-badge{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;
    border-radius:50%;background:var(--inset);border:1.5px solid var(--gold);color:var(--gold);

  .love-style{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin:0 0 6px}
  .result-intro{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:400}
  .result-name{font-size:29px;line-height:1.14;margin:2px 0 12px}
  .result-tag{color:var(--ink2);font-size:15px;line-height:1.6;margin:0 auto;max-width:400px;font-weight:400;font-family:"Assistant",sans-serif}

  /* prominent coupon box — brief: "אזור הקופון בתיבה מעוצבת ובולטת" */
  .coupon{margin:24px 0 6px;border-radius:18px;background:var(--ink);color:#fff;padding:24px 18px 22px;text-align:center;position:relative;overflow:hidden}
  .coupon::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(196,162,101,.22),transparent 70%);pointer-events:none}
  .coupon .c-gift{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);position:relative}
  .coupon .c-head{font-family:"Assistant",sans-serif;font-weight:700;font-size:21px;line-height:1.3;margin:8px 0 14px;color:#fff;position:relative}
  .coupon .c-pill{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    border:1.5px dashed var(--gold-soft);border-radius:999px;padding:12px 18px;max-width:300px;margin:0 auto;cursor:pointer;
    transition:background .2s}
  .coupon .c-pill:hover{background:rgba(255,255,255,.05)}
  .coupon .c-lbl{font-size:12px;color:#cfc7ba;font-weight:300}
  .coupon .c-code{font-family:"Assistant",sans-serif;font-weight:900;font-size:24px;letter-spacing:.14em;color:#fff;padding-right:.14em}
  .coupon .c-copy{font-size:11px;color:var(--gold-soft);font-weight:600}
  .coupon .c-note{font-size:11.5px;color:#cfc7ba;margin-top:12px;font-weight:300;position:relative}

  .reading{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:18px;
    font-size:14.5px;line-height:1.8;color:var(--ink2);margin:6px 0 4px;font-weight:300}
  .ritual-h{font-family:"Assistant",sans-serif;font-weight:700;font-size:19px;margin:26px 0 4px;text-align:center}
  .ritual-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 16px;font-weight:300;letter-spacing:.02em}
  .product{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
  .product.hero-product{border:1.5px solid var(--gold);background:var(--inset)}
  .soul-tag{position:absolute;top:-10px;right:16px;background:var(--gold);color:#fff;font-size:9.5px;
    font-weight:600;letter-spacing:.1em;padding:3px 11px;border-radius:999px}
  .product .prow{display:flex;gap:14px;align-items:center}
  .product .pimg{width:64px;height:78px;flex:0 0 64px;border-radius:10px;background:var(--inset);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--faint);
    text-align:center;line-height:1.3;padding:6px;border:1px solid var(--line);white-space:pre-line}
  .product .pinfo{flex:1;min-width:0}
  .product .pline{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:2px}
  .product .pname{font-family:"Assistant",sans-serif;font-weight:700;font-size:16px;line-height:1.2}
  .product .pwhy{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;font-weight:300}
  .product .pprice{margin-top:8px;display:flex;align-items:baseline;gap:8px}
  .pprice .now{font-weight:600;font-size:16px;color:var(--ink)}
  .pprice .was{font-size:12.5px;color:var(--faint);text-decoration:line-through}
  .pprice .save{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .product .padd{margin-top:12px}
  .btn.add{padding:11px 18px;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;letter-spacing:.02em}
  .btn.add:hover{border-color:var(--gold);background:var(--inset)}

  .total{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 2px;font-size:14px;color:var(--ink2)}
  .total .was{font-size:13px;color:var(--faint);text-decoration:line-through}
  .total .t-now{font-family:"Assistant",sans-serif;font-weight:900;font-size:22px;color:var(--ink)}
  .share{margin-top:18px;text-align:center;font-size:13px;color:var(--muted);font-weight:300}
  .share a{color:var(--gold);text-decoration:none;font-weight:500}
  .share a:hover{color:var(--ink)}

  .hidden{display:none!important}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-width:430px){
    .pad{padding:24px 18px 28px}
    h1{font-size:27px}
    .hero-h1{font-size:26px}
    .result-name{font-size:25px}
    .q-title{font-size:21px}
    .opt{padding:13px;gap:11px}
    .opt .o-emoji{width:38px;height:38px;flex-basis:38px;font-size:17px}
  }
</style>
</head>

  { title:"איך היית רוצה שהערב שלך ירגיש?",
    options:[
      {key:"calm",      title:"שלווה שקטה",   desc:"זמן איכות עם עצמי, ריחות מרגיעים ורגע של ניתוק."},
      {key:"radiant",   title:"אנרגיה זוהרת", desc:"תחושה של חיוניות, רעננות וביטחון עצמי שמוקרן החוצה."},
      {key:"pampering", title:"חיבוק מפנק",   desc:"רגע אינטימי ועוטף, שמוקדש כולו להזנה עמוקה של הגוף."},
      {key:"radiant",   title:"טבע טהור",     desc:"חיבור מקרקע לשורשים, נשימה עמוקה של מינרלים ותחושה נקייה."} ]},
  { title:"אילו מרקמים גורמים לעור שלך להרגיש הכי בנוח?",
    options:[
      {key:"calm",      title:"משי וקלילות",    desc:"מגע עדין שנספג בשניות, ומשאיר אותך רעננה וחופשיה."},
      {key:"pampering", title:"עטיפה חמאתית",   desc:"מרקם עשיר, עמוק ומלטף שמעניק תחושת הזנה אינטנסיבית."},
      {key:"radiant",   title:"רעננות מינרלית", desc:"תחושה חיה, טהורה ועוצמתית, כמו חיבור ישיר לטבע."},
      {key:"pampering", title:"קטיפה חלקה",     desc:"מגע רך ומפנק שמותיר את העור בניחוח עדין לאורך שעות."} ]},
  { title:"איזו מתנה היית רוצה להעניק לעצמך ולעור שלך לכבוד החג?",
    options:[
      {key:"radiant",   title:"רגע של הארה",     desc:"להדגיש את הזוהר הטבעי שלך ולהרגיש חיונית."},
      {key:"calm",      title:"התחדשות מרגיעה",  desc:"להשיל את העייפות ולהעניק לעור תחושת נינוחות עמוקה."},
      {key:"pampering", title:"עטיפה של אהבה",   desc:"טקס טיפוח מלא ומרגיע, מהמקלחת ועד הלילה."},
      {key:"calm",      title:"שקט פנימי",       desc:"רגע קצר ומינימליסטי של טיפוח שנותן לי בדיוק את מה שאני צריכה."} ]},
  { title:"מה גורם לך להרגיש הכי נהדרת ביום-יום?",
    options:[
      {key:"pampering", title:"תחושת רוויה",   desc:"כשהעור שלי מרגיש גמיש, עשיר בלחות ונינוח לאורך כל היום."},
      {key:"radiant",   title:"חיוניות זורחת", desc:"כשאני קמה בבוקר ורואה מראה רענן ומלא חיים."},
      {key:"calm",      title:"איזון ושקט",    desc:"כשהעור מקרין אחידות, רוגע וניקיון טבעי."},
      {key:"pampering", title:"רכות מלטפת",    desc:"כשהמגע של העור פשוט מזמין, רך ומפנק."} ]}
];

const LETTERS = ["א","ב","ג","ד"];
let state = { step:"landing", qIndex:0, votes:[] };
const stage = document.getElementById("stage");
const money = n => "₪" + n.toLocaleString("he-IL");
const ORN = `<div class="orn"><span class="rule"></span><span class="star">✦</span><span class="rule"></span></div>`;

function render(){
  stage.classList.remove("fade"); void stage.offsetWidth; stage.classList.add("fade");
  if(state.step==="landing")  return renderLanding();
  if(state.step==="question") return renderQuestion();
  if(state.step==="result")   return renderResult();
}

/* ---------- SCREEN 1 : Landing (photo-led) ---------- */
function renderLanding(){
  stage.innerHTML = `
    <div class="hero-photo">
      <div class="hp-logo">AHAVA</div>
    </div>
    <div class="pad" style="padding-top:22px">
      <p class="hp-kicker">לכבוד ט״ו באב · חג האהבה</p>
      <h1 class="hero-h1">מצאי את <span class="accent">השידוך המושלם</span> לעור שלך</h1>
      <p class="lead" style="margin-top:12px">אנחנו מאמינים שאהבה אמיתית מתחילה כשאת מרגישה הכי בנוח עם עצמך. עני על 4 שאלות קצרות, ונשדך לך את שגרת הטיפוח שתרגיש לך הכי טבעית, נעימה ומדויקת — כזו שנועדה לחגוג את האישה שאת היום, מחר ובכל יום שתבחרי.</p>
      <div class="promise">
        <span>4 שאלות קצרות</span><span class="dot"></span>
        <span>פחות מדקה</span><span class="dot"></span>
        <span>ובסוף מחכה לך מתנה של <b>30% הנחה</b></span>
      </div>
      <button class="btn" style="margin-top:18px" onclick="startQuiz()">גלי מי נועד עבורך <span class="chev">‹‹</span></button>
      <p class="footstrip">לרגל ט״ו באב · קוד הנחה <b>${COUPON}</b> · בתוקף לזמן מוגבל</p>
    </div>`;
}

/* ---------- SCREENS 2–5 : Questions ---------- */
function renderQuestion(){
  const q = QUESTIONS[state.qIndex]; const total = QUESTIONS.length;
  const dots = Array.from({length:total},(_,i)=>`<span class="${i<=state.qIndex?"on":""}"></span>`).join("");
  stage.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="goBack()" aria-label="חזרה">›</button>
      <div class="dots">${dots}</div>
      <div class="qcount">${state.qIndex+1} / ${total}</div>
    </div>
    <div class="pad" style="padding-top:16px">
      <div class="q-head">
        <p class="kicker">QUESTION ${state.qIndex+1}</p>
        <h2 class="q-title">${q.title}</h2>
      </div>
      <div class="options">
        ${q.options.map((o,i)=>`<button class="opt" onclick="pick('${o.key}')">
          <img class="o-thumb" src="img/q${state.qIndex+1}-${i+1}.jpg" alt="" loading="lazy" />
          <span class="o-text"><span class="o-title">${o.title}</span><span class="o-desc">${o.desc}</span></span>
          <span class="o-arrow">‹</span></button>`).join("")}
      </div>
    </div>`;
}


/* ---------- SCREEN 7 : Result ---------- */
function renderResult(){
  const key = scoreMatch(); const m = MATCHES[key];
  const subtotal   = m.hero.price + m.mate.price;
  const discounted = Math.round(subtotal*(1-DISCOUNT));
  const priceRow = p => { const now=Math.round(p.price*(1-DISCOUNT));
    return `<div class="pprice"><span class="now">${money(now)}</span><span class="was">${money(p.price)}</span><span class="save">‑30%</span></div>`; };
  dl("quiz_result",{result_key:key,result_name:m.name,result_style:m.style,products_count:2,total_value:discounted,currency:"ILS",coupon_code:COUPON});
  const card = (p,hero)=>`<div class="product${hero?" hero-product":""}">
        ${hero?`<span class="soul-tag">הזיווג שלך</span>`:""}
        <div class="prow">
          <div class="pimg">${p.bottle}</div>
          <div class="pinfo">
            <div class="pline">${p.line}</div>
            <div class="pname">${p.name}</div>
            <div class="pwhy">${p.why}</div>
            ${priceRow(p)}
          </div>
        </div>
        <div class="padd"><button class="btn add" onclick="addToCart('${p.vid}','${p.name.replace(/'/g,'')}',${p.price})">הוסיפי ישירות לסל שלך</button></div>
      </div>`;

  stage.innerHTML = `
    <div class="result-photo" style="background-image:url('img/result-${key}.jpg')">
      <div class="rp-scrim">
        <p class="love-style">✦ &nbsp;${m.style}</p>
        <p class="result-intro">הכירי את הזיווג המדויק שלך</p>
        <h2 class="result-name">${m.name}</h2>
      </div>
    </div>
    <div class="result-band">
      <p class="result-tag">${m.tagline}</p>
    </div>
    <div class="pad">

      <!-- Prominent coupon box (brief screen 7) -->
      <div class="coupon">
        <div class="c-gift">מתנת ט״ו באב שלך</div>
        <div class="c-head">הנה ה‑30% הנחה שלך לחגיגת ט״ו באב!</div>
        <div class="c-pill" onclick="copyCode()" id="copyPill">
          <span class="c-lbl">קוד קופון:</span>
          <span class="c-code">${COUPON}</span>
          <span class="c-copy" id="copyState">העתקה ‹</span>
        </div>
        <div class="c-note">לחצי להעתקה · הקוד יחכה לך גם במייל</div>
      </div>

      <div class="reading">${m.reading}</div>

      ${ORN}
      <h3 class="ritual-h">הזוג המושלם שלך</h3>
      <p class="ritual-sub">מוצר הזיווג · ובן-זוג שמשלים אותו · קני כזוג או בנפרד</p>

      ${card(m.hero,true)}
      ${card(m.mate,false)}

      <div class="total"><span>סה״כ לזוג</span>
        <span><span class="was">${money(subtotal)}</span> &nbsp; <span class="t-now">${money(discounted)}</span></span></div>

      <div style="margin-top:16px">
        <button class="btn gold" onclick="addSet('${key}')">הוסיפי את הזוג לסל</button>
        <button class="btn ghost" onclick="restart()" style="margin-top:8px">עשי את הקוויז שוב</button>
      </div>

      <p class="share">אהבת? <a href="#" onclick="return false">שתפי חברה וגלו מי הזיווג שלה →</a></p>
      <p class="fineprint" style="margin-top:18px">*${FINEPRINT}</p>
    </div>`;
}

/* ---------- flow ---------- */
function startQuiz(){ state={step:"question",qIndex:0,votes:[]}; dl("quiz_start"); fbqTrack("ViewContent",{content_name:QUIZ_ID}); render(); }
function pick(key){
  const q=QUESTIONS[state.qIndex], o=q.options.find(x=>x.key===key)||{};
  state.votes[state.qIndex]=key;
  dl("quiz_answer_"+(state.qIndex+1),{question_number:state.qIndex+1,question_title:q.title,answer_value:key,answer_label:o.title});
  if(state.qIndex<QUESTIONS.length-1){ state.qIndex++; state.step="question"; }
  else { const k=scoreMatch(); dl("quiz_complete",{questions_total:QUESTIONS.length,result_key:k}); state.step="result"; }
  render(); }
function goBack(){
  if(state.step==="result"){ state.step="question"; state.qIndex=QUESTIONS.length-1; }
  else if(state.step==="question" && state.qIndex>0){ dl("quiz_navigation",{nav_direction:"back",from_step:"q"+(state.qIndex+1),to_step:"q"+state.qIndex}); state.qIndex--; }
  else { state.step="landing"; } render(); }
function restart(){ state={step:"landing",qIndex:0,votes:[]}; render(); }

/* tally votes; on a tie, the user's earliest-voted persona wins (stable) */
function scoreMatch(){
  const tally={}; state.votes.forEach(k=>tally[k]=(tally[k]||0)+1);
  let best=state.votes[0]||"radiant", bestN=0;
  state.votes.forEach(k=>{ if((tally[k]||0)>bestN){ bestN=tally[k]; best=k; }});
  return MATCHES[best]?best:"radiant";
}

function copyCode(){ navigator.clipboard?.writeText(COUPON);
  const s=document.getElementById("copyState"); if(s){ s.textContent="✓ הועתק"; setTimeout(()=>s.textContent="העתקה ‹",1800);} }
function addToCart(vid,name,price){
  const v=Math.round(price*(1-DISCOUNT)), url=cartUrl([vid]);
  dl("quiz_add_to_cart",{atc_type:"single",product_ids:[vid],product_names:[name],product_count:1,value:v,currency:"ILS",cart_url:url});
  fbqTrack("AddToCart",{value:v,currency:"ILS",content_ids:[vid],content_type:"product",num_items:1});
  setTimeout(()=>{ window.location.href=url; },200);
}
function addSet(key){
  const m=MATCHES[key], vids=[m.hero.vid,m.mate.vid], v=Math.round((m.hero.price+m.mate.price)*(1-DISCOUNT)), url=cartUrl(vids);
  dl("quiz_add_to_cart",{atc_type:"bundle",product_ids:vids,product_names:[m.hero.name,m.mate.name],product_count:2,bundle_price:v,value:v,currency:"ILS",cart_url:url});
  fbqTrack("AddToCart",{value:v,currency:"ILS",content_ids:vids,content_type:"product_group",num_items:2});
  setTimeout(()=>{ window.location.href=url; },200);
}

loadAnalytics();
render();
</script>
