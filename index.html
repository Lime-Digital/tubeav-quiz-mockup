<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AHAVA · מצאי את הזיווג המושלם שלך · טו באב</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* AHAVA mineral-luxe palette (from production quiz code) */
    --cream:#FAF7F2;
    --salt:#F5F0E8;
    --inset:#FAF6EE;
    --card:#FFFFFF;
    --ink:#1F1D1A;
    --ink2:#3A3733;
    --muted:#7A746A;
    --faint:#A89F92;
    --line:#E5E0D6;
    --gold:#C4A265;
    --gold-soft:#E7CF9B;
    --gold-line:rgba(196,162,101,.4);
    --shadow:0 16px 40px rgba(31,26,20,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Heebo",sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;
  }
  h1,h2,h3,.serif{font-family:"Frank Ruhl Libre",serif;font-weight:700;letter-spacing:-.01em}
  .wrap{width:100%;max-width:540px;margin:0 auto}
  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);overflow:hidden;position:relative;
  }
  .pad{padding:30px 26px 32px}
  .mockup-flag{
    position:fixed;top:10px;left:10px;z-index:50;background:var(--ink);color:#fff;
    font-size:11px;font-weight:500;padding:5px 11px;border-radius:999px;letter-spacing:.04em;opacity:.82
  }

  /* logo + ornament */
  .logo{font-family:"Heebo";font-weight:600;letter-spacing:.45em;font-size:17px;
    color:var(--ink);margin:0;padding-right:.45em;text-align:center}
  .logo small{display:block;font-weight:400;letter-spacing:.3em;font-size:8.5px;
    color:var(--faint);margin-top:7px;padding-right:.3em}
  .orn{display:flex;align-items:center;justify-content:center;gap:13px;margin:20px 0}
  .orn .rule{height:1px;width:54px;background:var(--gold-line)}
  .orn .star{color:var(--gold);font-size:14px}
  .kicker{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin:0;text-align:center}
  .kicker.he{letter-spacing:.12em}

  /* ---------- LANDING ---------- */
  .hero-band{background:var(--salt);padding:34px 26px 30px;text-align:center;border-bottom:1px solid var(--line)}
  h1{font-size:32px;line-height:1.14;margin:6px 0 14px}
  h1 .accent{color:var(--gold)}
  .lead{color:var(--muted);font-size:15.5px;line-height:1.65;margin:0 auto;max-width:410px;font-weight:300}
  .icons-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 4px}
  .icon-card{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:15px 6px 12px;text-align:center}
  .icon-emoji{font-size:22px;display:block;margin-bottom:8px}
  .icon-name{font-family:"Frank Ruhl Libre",serif;font-size:13px;font-weight:700;line-height:1.2}
  .icon-sub{font-size:10.5px;color:var(--muted);margin-top:4px}

  /* buttons — AHAVA style */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;cursor:pointer;
    background:var(--ink);color:#fff;font-family:"Heebo";font-weight:500;font-size:14px;
    letter-spacing:.12em;padding:16px 22px;border-radius:999px;
    transition:background .25s ease;
  }
  .btn:hover{background:var(--gold)}
  .btn.gold{background:var(--gold);color:var(--ink);font-weight:600}
  .btn.gold:hover{background:var(--ink);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:400;letter-spacing:.04em;font-size:13.5px}
  .btn.ghost:hover{background:transparent;color:var(--ink)}
  .fineprint{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.55;font-weight:300}
  .fineprint b{font-weight:600;color:var(--ink2)}

  /* ---------- PROGRESS ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:18px 22px 0}
  .back{background:none;border:none;color:var(--faint);font-size:24px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
  .back:hover{color:var(--gold)}
  .dots{display:flex;gap:9px;flex:1;justify-content:center}
  .dots span{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .25s,transform .25s}
  .dots span.on{background:var(--gold);transform:scale(1.25)}
  .qcount{font-size:11px;color:var(--faint);min-width:34px;text-align:left;letter-spacing:.1em}

  /* ---------- QUESTION ---------- */
  .q-head{text-align:center;padding:10px 6px 4px}
  .q-title{font-size:25px;line-height:1.22;margin:12px 0 4px}
  .q-sub{color:var(--muted);font-size:14px;margin:10px 0 0;font-weight:300}
  .options{display:grid;gap:10px;margin-top:22px}
  .opt{display:flex;align-items:center;gap:14px;text-align:right;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;width:100%;
    font-family:"Heebo";transition:border-color .18s,background .18s}
  .opt:hover{border-color:var(--gold);background:var(--inset)}
  .opt .o-emoji{width:44px;height:44px;flex:0 0 44px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:21px;
    color:var(--gold);background:var(--inset);border:1px solid var(--line)}
  .opt:hover .o-emoji{background:#fff}
  .opt .o-text{flex:1}
  .opt .o-title{font-weight:500;font-size:16px;line-height:1.25}
  .opt .o-desc{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:300}
  .opt .o-arrow{color:var(--gold);font-size:18px;opacity:0;transition:opacity .18s}
  .opt:hover .o-arrow{opacity:1}

  /* ---------- EMAIL ---------- */
  .center{text-align:center}
  .field{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font-family:"Heebo";font-size:16px;margin-top:11px;text-align:right;background:var(--card);color:var(--ink)}
  .field:focus{outline:none;border-color:var(--gold)}

  /* ---------- RESULT ---------- */
  .result-band{background:var(--salt);text-align:center;padding:34px 24px 26px;border-bottom:1px solid var(--line)}
  .match-badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:112px;height:112px;border-radius:50%;background:var(--card);border:1.5px solid var(--gold);margin:0 auto 16px}
  .match-pct{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:33px;color:var(--ink);line-height:1}
  .match-lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:4px}
  .love-style{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 6px}
  .result-name{font-size:28px;line-height:1.14;margin:2px 0 10px}
  .result-tag{color:var(--muted);font-size:15px;line-height:1.6;margin:0 auto;max-width:390px;font-weight:300;font-style:italic;font-family:"Frank Ruhl Libre",serif}
  .reading{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:18px 18px;
    font-size:14.5px;line-height:1.75;color:var(--ink2);margin:24px 0 4px;font-weight:300}
  .ritual-h{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:19px;margin:26px 0 4px;text-align:center}
  .ritual-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 16px;font-weight:300;letter-spacing:.02em}
  .product{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:10px}
  .product .pimg{width:64px;height:76px;flex:0 0 64px;border-radius:10px;background:var(--inset);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--faint);
    text-align:center;line-height:1.3;padding:6px;border:1px solid var(--line);white-space:pre-line}
  .product .pinfo{flex:1;min-width:0}
  .product .pline{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:2px}
  .product .pname{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:16px;line-height:1.2}
  .product .pwhy{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;font-weight:300}
  .product .pprice{margin-top:8px;display:flex;align-items:baseline;gap:8px}
  .pprice .now{font-weight:600;font-size:16px;color:var(--ink)}
  .pprice .was{font-size:12.5px;color:var(--faint);text-decoration:line-through}
  .pprice .save{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .hero-product{border:1.5px solid var(--gold);background:var(--inset);position:relative}
  .soul-tag{position:absolute;top:-10px;right:16px;background:var(--gold);color:#fff;font-size:9.5px;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:999px}

  .coupon{margin:24px 0 4px;border-radius:16px;background:var(--ink);color:#fff;padding:22px 18px;text-align:center}
  .coupon .c-top{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft)}
  .coupon .c-code{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:32px;letter-spacing:.16em;
    color:#fff;margin:8px 0 3px;padding-right:.16em}
  .coupon .c-sub{font-size:12px;color:#cfc7ba;margin-bottom:16px;font-weight:300}
  .coupon .btn.gold{max-width:240px;margin:0 auto}
  .total{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 2px;font-size:14px;color:var(--ink2)}
  .total .was{font-size:13px}
  .total .t-now{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:22px;color:var(--ink)}
  .share{margin-top:18px;text-align:center;font-size:13px;color:var(--muted);font-weight:300}
  .share a{color:var(--gold);text-decoration:none;font-weight:500}
  .share a:hover{color:var(--ink)}

  .hidden{display:none!important}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-width:430px){
    .pad{padding:24px 18px 28px}
    h1{font-size:28px}
    .result-name{font-size:24px}
    .q-title{font-size:22px}
    .icons-row{gap:7px}
    .icon-name{font-size:12px}
    .icon-sub{display:none}
    .opt{padding:13px;gap:11px}
    .opt .o-emoji{width:40px;height:40px;flex-basis:40px;font-size:18px}
  }
</style>
</head>

      <p class="fineprint" style="margin:20px 0 16px">4 שאלות · פחות מדקה · ובסוף מחכה לך <b>30% הנחה</b></p>
      <button class="btn" onclick="startQuiz()">בואו נמצא התאמה</button>
      <p class="fineprint">לרגל טו באב · קוד הנחה <b>${COUPON}</b> · בתוקף לזמן מוגבל</p>
    </div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.qIndex]; const total = QUESTIONS.length;
  const dots = Array.from({length:total},(_,i)=>`<span class="${i<=state.qIndex?"on":""}"></span>`).join("");
  stage.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="goBack()" aria-label="חזרה">›</button>
      <div class="dots">${dots}</div>
      <div class="qcount">${state.qIndex+1} / ${total}</div>
    </div>
    <div class="pad" style="padding-top:16px">
      <div class="q-head">
        <p class="kicker">QUESTION ${state.qIndex+1}</p>
        <h2 class="q-title">${q.title}</h2>
        ${q.sub?`<p class="q-sub">${q.sub}</p>`:""}
      </div>
      <div class="options">
        ${q.options.map((o,i)=>`<button class="opt" onclick="pick('${o.key}')">
          <span class="o-emoji">${["א","ב","ג"][i]}</span>
          <span class="o-text"><span class="o-title">${o.title}</span>${o.desc?`<span class="o-desc">${o.desc}</span>`:""}</span>
          <span class="o-arrow">‹</span></button>`).join("")}
      </div>
    </div>`;
}

function renderEmail(){
  stage.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="goBack()" aria-label="חזרה">›</button>
      <div class="dots">${"<span class='on'></span>".repeat(4)}</div>
      <div class="qcount"></div>
    </div>
    <div class="pad center" style="padding-top:20px">
      ${ORN}
      <h2 class="q-title">מצאנו את הזיווג שלך</h2>
      <p class="q-sub" style="margin-top:10px">לאן לשלוח את ההתאמה שלך ואת קוד ה‑30%?<br>נשמור לך אותם גם להמשך — בלי לחץ.</p>
      <input class="field" id="fname" placeholder="השם שלך" />
      <input class="field" id="email" type="email" placeholder="כתובת אימייל" />
      <div style="margin-top:20px">
        <button class="btn" onclick="goResult()">גלי את ההתאמה</button>
        <button class="btn ghost" onclick="goResult()" style="margin-top:8px">דלגי — קחי אותי ישר לתוצאה</button>
      </div>
      <p class="fineprint">בלי ספאם. רק העור שלך והקוד שלך.</p>
    </div>`;
}

function renderResult(){
  const key = scoreMatch(); const m = MATCHES[key];
  const items = [{...m, bottle:m.bottle, name:m.name, line:m.line, price:m.price, why:m.why}, ...m.support];
  const subtotal = items.reduce((s,p)=>s+p.price,0);
  const discounted = Math.round(subtotal*(1-DISCOUNT));
  const priceRow = p => { const now=Math.round(p.price*(1-DISCOUNT));
    return `<div class="pprice"><span class="now">${money(now)}</span><span class="was">${money(p.price)}</span><span class="save">‑30%</span></div>`; };

  stage.innerHTML = `
    <div class="result-band">
      <div class="match-badge"><span class="match-pct">${m.pct}%</span><span class="match-lbl">התאמה</span></div>
      <p class="love-style">${m.emoji} &nbsp;${m.loveStyle}</p>
      <h2 class="result-name">${m.name}</h2>
      <p class="result-tag">${m.tagline}</p>
    </div>
    <div class="pad">
      <div class="reading">${m.reading}</div>
      ${ORN}
      <h3 class="ritual-h">הריטואל המושלם שלכן</h3>
      <p class="ritual-sub">המוצר שנברא בשבילך · ושניים שמשלימים אותו</p>

      <div class="product hero-product">
        <span class="soul-tag">הזיווג שלך</span>
        <div class="pimg">${m.bottle}</div>
        <div class="pinfo"><div class="pline">${m.line}</div><div class="pname">${m.name}</div>
          <div class="pwhy">${m.why}</div>${priceRow(m)}</div>
      </div>
      ${m.support.map(p=>`<div class="product"><div class="pimg">${p.bottle}</div>
        <div class="pinfo"><div class="pline">${p.line}</div><div class="pname">${p.name}</div>
          <div class="pwhy">${p.why}</div>${priceRow(p)}</div></div>`).join("")}

      <div class="coupon">
        <div class="c-top">מתנת טו באב שלך</div>
        <div class="c-code">${COUPON}</div>
        <div class="c-sub">30% הנחה על הריטואל המושלם · בתוקף לזמן מוגבל</div>
        <button class="btn gold" onclick="copyCode()" id="copyBtn">העתיקי את הקוד</button>
      </div>

      <div class="total"><span>סה״כ לריטואל המלא</span>
        <span><span class="was">${money(subtotal)}</span> &nbsp; <span class="t-now">${money(discounted)}</span></span></div>

      <div style="margin-top:16px">
        <button class="btn gold" onclick="alert('בבנייה האמיתית: לעגלת AHAVA הישראלית עם הקוד מוחל אוטומטית')">הוסיפי את הריטואל לעגלה</button>
        <button class="btn ghost" onclick="restart()" style="margin-top:8px">עשי את הקוויז שוב</button>
      </div>
      <p class="share">אהבת? <a href="#" onclick="return false">שתפי חברה וגלו מי הזיווג שלה →</a></p>
    </div>`;
}

function startQuiz(){ state={step:"question",qIndex:0,votes:[]}; render(); }
function pick(key){ state.votes[state.qIndex]=key;
  if(state.qIndex<QUESTIONS.length-1){ state.qIndex++; state.step="question"; } else { state.step="email"; } render(); }
function goBack(){
  if(state.step==="email"){ state.step="question"; state.qIndex=QUESTIONS.length-1; }
  else if(state.step==="question" && state.qIndex>0){ state.qIndex--; }
  else { state.step="landing"; } render(); }
function goResult(){ state.step="result"; render(); }
function restart(){ state={step:"landing",qIndex:0,votes:[]}; render(); }
function scoreMatch(){
  const tally={}; state.votes.forEach(k=>tally[k]=(tally[k]||0)+1);
  let best=null,bestN=-1; const order=[state.votes[0],...Object.keys(MATCHES)];
  order.forEach(k=>{ if(k&&(tally[k]||0)>bestN){ bestN=tally[k]||0; best=k; }}); return best||"glow"; }
function copyCode(){ navigator.clipboard?.writeText(COUPON);
  const b=document.getElementById("copyBtn"); if(b){ b.textContent="✓ הקוד הועתק"; setTimeout(()=>b.textContent="העתיקי את הקוד",1800);} }

render();
</script>
</body>
</html>
