<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AHAVA · The Mineral Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F7F1E7; --sand:#EFE7D9; --gold:#C4A265; --gold-soft:#E7CF9B; --gold-deep:#9C7C42;
    --aqua:#6FA9AA; --ink:#2C2A26; --muted:#6E665A; --line:rgba(196,162,101,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--sand);color:var(--ink);font-family:"Assistant",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .serif{font-family:"Cormorant Garamond",serif}

  /* top nav */
  .nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
    padding:18px 26px}
  .nav a{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);font-weight:600;text-decoration:none;
    opacity:.8;text-shadow:0 1px 8px rgba(255,255,255,.5)}
  .nav a:hover{opacity:1;color:var(--gold-deep)}
  .nav .logo{width:92px;height:auto;filter:drop-shadow(0 1px 6px rgba(255,255,255,.6))}

  /* scene */
  .scene{position:relative;width:100%;overflow:hidden;background:var(--sand)}
  .scene-img{display:block;width:100%;height:auto}
  .scene-img.mob{display:none}
  .scene::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(247,241,231,.35) 0%, transparent 20%, transparent 82%, rgba(239,231,217,.6) 100%)}

  .head{position:absolute;top:13%;left:0;right:0;text-align:center;z-index:3;padding:0 22px}
  .kicker{font-size:clamp(10px,1.3vw,12px);letter-spacing:.4em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-bottom:12px;text-shadow:0 1px 8px rgba(255,255,255,.6)}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(30px,4.6vw,58px);line-height:1.06;
    color:var(--ink);letter-spacing:.01em;text-shadow:0 1px 20px rgba(255,255,255,.5)}
  .sub{font-size:clamp(13px,1.5vw,16px);color:var(--ink);opacity:.82;font-weight:300;max-width:480px;margin:14px auto 0;line-height:1.6;text-shadow:0 1px 10px rgba(255,255,255,.6)}

  /* pick buttons over each pedestal */
  .pick{position:absolute;z-index:4;transform:translate(-50%,-50%);
    background:rgba(255,255,255,.7);backdrop-filter:blur(3px);border:1px solid var(--gold);color:var(--gold-deep);
    font-family:"Assistant";font-weight:700;font-size:clamp(11px,1.05vw,13px);letter-spacing:.06em;text-transform:uppercase;
    padding:11px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.25s;box-shadow:0 8px 22px rgba(44,42,38,.16)}
  .pick:hover{background:var(--gold);color:#fff;box-shadow:0 0 26px rgba(196,162,101,.55)}
  .pick.d1{left:30%;top:86%}
  .pick.d2{left:49.5%;top:88%}
  .pick.d3{left:68%;top:86%}
  .pick.m1,.pick.m2,.pick.m3{display:none}

  /* sparkle fx */
  .fx{position:absolute;z-index:2;width:200px;height:200px;transform:translate(-50%,-50%);pointer-events:none;opacity:0}
  .fx.go{animation:fxGo 1s ease-out forwards}
  .fx .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(231,207,155,.6),transparent 62%)}
  @keyframes fxGo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
  .fx .sp{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,#fff,var(--gold-soft) 45%,transparent);opacity:0}
  .fx.go .sp{animation:sp .9s ease-out forwards}
  @keyframes sp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}

  /* reveal */
  .reveal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;z-index:40;
    background:radial-gradient(60% 60% at 50% 40%, rgba(255,255,255,.5), rgba(120,150,150,.4));backdrop-filter:blur(5px);
    opacity:0;visibility:hidden;transition:opacity .55s ease}
  .reveal.on{opacity:1;visibility:visible}
  .card{position:relative;width:100%;max-width:420px;text-align:center;background:#FFFDF9;border:1px solid var(--line);
    border-radius:20px;padding:34px 28px 28px;box-shadow:0 34px 80px rgba(44,42,38,.26);
    transform:translateY(20px) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(196,162,101,.28);border-radius:13px;pointer-events:none}
  .reveal.on .card{transform:none}
  .gift-img-wrap{width:158px;height:158px;margin:0 auto 8px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle,#fff 0%,#F3ECDD 72%,#E6D9C0 100%);box-shadow:0 0 40px rgba(231,207,155,.45)}
  .gift-img-wrap img{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(44,42,38,.16))}
  .reveal-k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-top:6px}
  .gift-name{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;line-height:1.16;color:var(--ink);margin:8px 0 10px}
  .gift-desc{font-size:14.5px;color:var(--muted);line-height:1.65;font-weight:300;max-width:330px;margin:0 auto 22px}
  .coupon{border:1.5px dashed var(--gold);border-radius:14px;padding:13px 16px;background:#FBF6EC;margin-bottom:22px}
  .coupon .cl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .coupon .cc{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:30px;letter-spacing:.14em;color:var(--gold-deep);margin-top:2px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#3a2c10;font-family:"Assistant";font-weight:700;
    font-size:14.5px;letter-spacing:.03em;padding:17px 22px;border-radius:999px;transition:.25s;box-shadow:0 8px 26px rgba(196,162,101,.34)}
  .btn:hover{filter:brightness(1.05);box-shadow:0 0 28px rgba(231,207,155,.6)}
  .again{display:inline-block;margin-top:15px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:500}
  .again:hover{color:var(--gold-deep)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;
    font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;transition:.35s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .flag{position:fixed;top:8px;right:8px;background:rgba(196,162,101,.85);color:#3a2c10;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:70}

  @media(max-width:760px){
    .scene-img.desk{display:none}.scene-img.mob{display:block}
    .pick.d1,.pick.d2,.pick.d3{display:none}
    .pick.m1,.pick.m2,.pick.m3{display:block}
    .pick.m1{left:24%;top:84%}.pick.m2{left:50%;top:85%}.pick.m3{left:74%;top:84%}
    .nav{padding:14px 16px}.nav a{font-size:10px;letter-spacing:.18em}.head{top:9%}
  }
</style>
</head>
<body>
<div class="flag">DEMO</div>

<div class="scene" id="scene">
  <div class="nav">
    <a href="#" onclick="return false">Contact Us</a>
    <img class="logo" src="img/ahava-logo.png" alt="AHAVA" />
    <a href="#" onclick="return false">Menu</a>
  </div>

  <img class="scene-img desk" src="img/sanctuary-desktop.jpg" alt="" />
  <img class="scene-img mob" src="img/sanctuary-mobile.jpg" alt="" />

  <div class="head">
    <p class="kicker">AHAVA · Dead Sea Minerals</p>
    <h1 class="serif">The Mineral Sanctuary</h1>
    <p class="sub">Three minerals, drawn from the depths of the Dead Sea. Choose one to reveal the gift made for you.</p>
  </div>

  <div class="fx" id="fx"><span class="ring"></span></div>

  <button class="pick d1" data-i="0">Reveal the gift</button>
  <button class="pick d2" data-i="1">Reveal the gift</button>
  <button class="pick d3" data-i="2">Reveal the gift</button>
  <button class="pick m1" data-i="0">Reveal</button>
  <button class="pick m2" data-i="1">Reveal</button>
  <button class="pick m3" data-i="2">Reveal</button>
</div>

<div class="reveal" id="reveal"><div class="card" id="card"></div></div>
<div class="toast" id="toast">✓ Code copied</div>

<script>
const STORE="https://www.ahava.com", COUPON="TRY30";
const cartUrl=vid=>STORE+"/discount/"+COUPON+"?redirect="+encodeURIComponent("/cart/"+vid+":1?utm_source=sanctuary&utm_medium=referral&utm_campaign=mineral-sanctuary");

const TREASURES=[
  {name:"Crystal Osmoter™ X6 Serum", desc:"Six times the Dead Sea mineral concentration for visibly luminous, transformed skin.",
   vid:"40901779882153", img:"https://cdn.shopify.com/s/files/1/0561/2378/5385/files/Crystal-Osmoter-X6-Serum-82615090_f.png?v=1760956639"},
  {name:"24K Gold Mineral Mud Mask", desc:"Pure Dead Sea mud meets 24K gold for an instant, radiant glow.",
   vid:"40901782700201", img:"https://cdn.shopify.com/s/files/1/0561/2378/5385/products/24k-gold-mineral-mud-mask_1.png?v=1662284226"},
  {name:"Purifying Mud Mask", desc:"Pure Dead Sea mud that purifies, detoxifies and draws out impurities.",
   vid:"40901769855145", img:"https://cdn.shopify.com/s/files/1/0561/2378/5385/files/mudmusk1.png?v=1756632838"}
];

const fx=document.getElementById("fx"), reveal=document.getElementById("reveal"), card=document.getElementById("card");
for(let k=0;k<16;k++){const a=k/16*6.283,r=64+(k%3)*24;const s=document.createElement("span");
  s.className="sp";s.style.setProperty("--dx",(Math.cos(a)*r).toFixed(0)+"px");
  s.style.setProperty("--dy",(Math.sin(a)*r).toFixed(0)+"px");s.style.animationDelay=(k%5)*40+"ms";fx.appendChild(s);}

let busy=false;
document.querySelectorAll(".pick").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(busy) return; busy=true;
    const cs=getComputedStyle(btn);
    fx.style.left=cs.left; fx.style.top="calc("+cs.top+" - 64px)";
    fx.classList.remove("go"); void fx.offsetWidth; fx.classList.add("go");
    setTimeout(()=>{ showGift(+btn.getAttribute("data-i")); busy=false; },800);
  });
});

function showGift(i){
  const t=TREASURES[i];
  card.innerHTML=`
    <div class="gift-img-wrap"><img src="${t.img}" alt="${t.name}" /></div>
    <p class="reveal-k">Your Gift</p>
    <h2 class="gift-name serif">${t.name}</h2>
    <p class="gift-desc">${t.desc}</p>
    <div class="coupon"><div class="cl">Your gift code</div><div class="cc">${COUPON}</div></div>
    <button class="btn" id="claim">Claim Your Gift &amp; Continue Shopping</button>
    <span class="again" id="again">‹ Choose another mineral</span>`;
  reveal.classList.add("on");
  document.getElementById("claim").onclick=()=>{
    try{navigator.clipboard.writeText(COUPON);}catch(e){}
    const to=document.getElementById("toast");to.classList.add("on");setTimeout(()=>to.classList.remove("on"),1800);
    setTimeout(()=>{window.location.href=cartUrl(t.vid);},700);
  };
  document.getElementById("again").onclick=()=>reveal.classList.remove("on");
}
reveal.addEventListener("click",e=>{if(e.target===reveal)reveal.classList.remove("on");});
</script>
</body>
</html>
